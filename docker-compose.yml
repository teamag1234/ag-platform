services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ag_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag -d ag_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ag:${POSTGRES_PASSWORD}@db:5432/ag_platform
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # Migraciones, scripts y tareas programadas. Se usa con: docker compose run --rm jobs <comando>
  jobs:
    build:
      context: .
      target: build
    profiles: ["jobs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ag:${POSTGRES_PASSWORD}@db:5432/ag_platform
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./content:/app/content

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AULA_HOST: ${AULA_HOST:?Define AULA_HOST en .env (p. ej. aula.agacademyaptis.com)}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
